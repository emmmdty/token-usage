name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (defaults to the latest git tag)"
        required: false

permissions:
  contents: write
  packages: write

# Never run two releases for the same tag: a repeated trigger (e.g. tag
# push racing a manual dispatch) cancels the earlier run so goreleaser
# does not fail uploading assets that already exist.
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check release does not exist yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          tag="${RELEASE_TAG:-${GITHUB_REF_NAME}}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping."
            exit 0
          fi
          echo "Release $tag does not exist; proceeding."

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}