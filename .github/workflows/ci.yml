name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Only the latest run per branch/PR is kept (see concurrency docs); older queued runs are cancelled
# so GitHub Actions concurrency limits are not hit by stale runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Test
        env:
          TOKEN_USAGE_MASTER_PASSWORD: ci-test-master-password
          # Never probe the real system keyring in tests (macOS SecItemAdd
          # can block); credential tests use the encrypted-file backend.
          TOKEN_USAGE_KEYRING_DISABLED: "1"
        run: go test -v -race -count=1 ./...

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test with coverage
        env:
          TOKEN_USAGE_MASTER_PASSWORD: ci-test-master-password
          TOKEN_USAGE_KEYRING_DISABLED: "1"
        run: go test -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Report total
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload to Codecov
        # Tokenless upload works for public repos; never fail CI on it.
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build (all platforms)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile
        run: |
          for goos in linux darwin windows; do
            for goarch in amd64 arm64; do
              echo "Building ${goos}/${goarch}..."
              GOOS=$goos GOARCH=$goarch go build -v ./...
            done
          done
