version: "2"

run:
  timeout: 5m

linters:
  # standard set: errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  settings:
    staticcheck:
      checks:
        - all
        # QF1003 etc.: style-quiz quickfixes are noisy for this codebase.
        - -QF*
    errcheck:
      # CLI stdout/stderr writes: print errors are not actionable.
      exclude-functions:
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    generated: strict

formatters:
  exclusions:
    generated: strict
